<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download Center</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #0a0a0a;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
            line-height: 1.6;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            text-align: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 3rem;
        }

        .file-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .file-card {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 1.5rem;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .file-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.2);
            border-color: #667eea;
        }

        .file-icon {
            width: 60px;
            height: 60px;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            border-radius: 10px;
        }

        .pdf-icon {
            background: rgba(255, 87, 87, 0.1);
            color: #ff5757;
        }

        .img-icon {
            background: rgba(69, 183, 209, 0.1);
            color: #45b7d1;
        }

        .file-title {
            font-size: 1.1rem;
            font-weight: 500;
            margin-bottom: 0.5rem;
            color: #f0f0f0;
        }

        .file-name {
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 1.5rem;
            font-family: monospace;
        }

        .download-btn {
            width: 100%;
            padding: 0.75rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .download-btn:hover {
            transform: scale(1.02);
        }

        .download-btn:active {
            transform: scale(0.98);
        }

        .no-files {
            text-align: center;
            color: #555;
            padding: 3rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📁 Download Center</h1>
        <p class="subtitle">Your files, ready when you are</p>
        
        <div id="fileGrid" class="file-grid">
            <!-- Files will be inserted here by JavaScript -->
        </div>
		<div style="text-align: center; margin-top: 160px;">
  <a href="https://rimonsunker.github.io/download.tool/" target="_blank"
     style="color: #8a8a8a; text-decoration: none; margin-right: 14px;">
    1.Create_Code 
  </a>
  <a href="https://github.com/rimonsunker/download/edit/gh-pages/index.html" target="_blank"
     style="color: #9a9a9a; text-decoration: none;">
    2.Submit_Code
  </a>
  <a href="https://github.com/rimonsunker/download/upload/gh-pages" target="_blank"
     style="color: #9a9a9a; text-decoration: none;">
    3.Upload_Files
  </a>
</div>
    </div>

    <script>
        // Configuration: Add your files here
        // Format: { filename: "your-file.pdf", title: "Human Readable Title", type: "pdf" }
        const files = [
			{
  "filename": "OG-24.pdf",
  "title": "Admit (OG-24)",
  "type": "pdf"
},
			{
  "filename": "SO-24.pdf",
  "title": "Admit (SO - 24)",
  "type": "pdf"
},{
  "filename": "HeadM-25.pdf",
  "title": "Head Master(2025)",
  "type": "pdf"
			},
			{
  "filename": "SO-26.pdf",
  "title": "SO-26",
  "type": "pdf"
}
            
        ];

        function getFileIcon(type) {
            if (type === 'pdf') return '📄';
            if (type === 'image') return '🖼️';
            return '📁';
        }

        function createFileCard(file) {
            const card = document.createElement('div');
            card.className = 'file-card';
            
            const iconClass = file.type === 'pdf' ? 'pdf-icon' : 'img-icon';
            
            card.innerHTML = `
                <div class="file-icon ${iconClass}">
                    ${getFileIcon(file.type)}
                </div>
                <div class="file-title">${file.title}</div>
                <div class="file-name">${file.filename}</div>
                <button class="download-btn" onclick="downloadFile('${file.filename}')">
                    Download
                </button>
            `;
            
            return card;
        }

        function downloadFile(filename) {
            // Create a temporary link element
            const link = document.createElement('a');
            link.href = filename;
            link.download = filename;
            link.style.display = 'none';
            
            // Add to DOM, click, and remove
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // Initialize the page
        function init() {
            const grid = document.getElementById('fileGrid');
            
            if (files.length === 0) {
                grid.innerHTML = '<div class="no-files">No files available for download.</div>';
                return;
            }
            
            files.forEach(file => {
                grid.appendChild(createFileCard(file));
            });
        }

        // Run on page load
        init();
    </script>
</body>
</html>
